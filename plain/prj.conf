# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6_MLD=y

CONFIG_SHELL=y
CONFIG_NET_SHELL=y

CONFIG_LOG=y

# CHIP library
CONFIG_CHIP=y
CONFIG_CHIP_ETHERNET=y
CONFIG_CHIP_LIB_SHELL=n
CONFIG_STD_CPP17=y
CONFIG_POSIX_API=y
# mbedTLS 4.x (this Zephyr's default) removed the classic headers CHIP's
# direct-mbedtls crypto backend expects (mbedtls/bignum.h etc are gone/moved
# into tf-psa-crypto internals). Use CHIP's PSA-based crypto backend instead.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_CHIP_CRYPTO_PSA=y
# SPAKE2+ specifically: mbedTLS 4.x has no PSA_ALG_SPAKE2P_MATTER support
# (upstream mbedtls#9378/#9381, unresolved 2+ years), so PSASpake2p.cpp
# (chip_crypto_spake2p="psa") fails to link. CHIPCryptoPALPSA.cpp already
# contains a complete classic SPAKE2+ implementation against mbedTLS's
# private ecp.h/bignum.h, gated behind this exact Kconfig -- no new source
# file needed, just don't select the (broken) PSA-native pake variant.
CONFIG_CHIP_CRYPTO_SPAKE2P_MBEDTLS=y

# No Thread/BLE/Wi-Fi for this port.
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_OPENTHREAD=n
CONFIG_BT=n
CONFIG_CHIP_WIFI=n

# Data model + commissioning + on/off/level.
CONFIG_CHIP_PROJECT_CONFIG="include/CHIPProjectConfig.h"
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Persistent storage: a virtio-blk disk (see boards/qemu_x86.overlay),
# formatted FAT and auto-mounted via devicetree fstab, with CHIP's Settings
# using CONFIG_SETTINGS_FILE instead of the ephemeral RAM-backed flash
# simulator -- commissioning survives QEMU restarts.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_VIRTIO_BLK=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=n
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/SD:/settings/run"

# Entropy: prototype only, not a real HWRNG.
CONFIG_TEST_RANDOM_GENERATOR=y

# Memory. We have 32MB of board RAM to spare; be generous with both.
CONFIG_CHIP_MALLOC_SYS_HEAP=y
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=131072
CONFIG_MAIN_STACK_SIZE=32768
# Zephyr's OWN separate malloc arena (lib/libc/common/.../malloc.c) crashed in
# its own SYS_INIT hook (malloc_prepare) -- and it's dead weight for us anyway,
# since CHIP_MALLOC_SYS_HEAP_OVERRIDE wraps malloc/calloc/realloc/free to route
# through its own heap instead. Disabled outright; see plan-detailed.md.
CONFIG_COMMON_LIBC_MALLOC=n

# Logging: default 1KB deferred-log ring buffer overflows constantly under
# CHIP's verbose debug-level logging (commissioning especially), silently
# dropping messages. We have RAM to spare.
CONFIG_LOG_BUFFER_SIZE=16384
