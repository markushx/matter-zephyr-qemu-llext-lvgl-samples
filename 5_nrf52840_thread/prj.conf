CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter LLEXT"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/bridge.zap"
CONFIG_STD_CPP17=y

CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60
CONFIG_BT_DEVICE_NAME="MatterLLEXT"
CONFIG_DK_LIBRARY=y

# Flash space comes first here. Same as the release configuration of Nordic's
# Matter samples, and without the bootloader, OTA and factory data as well:
# the device uses the SDK's test DAC and the default test pairing code.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_THREAD_NAME=n
CONFIG_BOOT_BANNER=n
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_DFU_OVER_BT_SMP=n

# The default 8 KiB runs out once a second fabric is added (PSA error -142 while
# committing it). 32 KiB is what Nordic's static partition maps use.
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

# LLEXT: extensions run from RAM, which the MPU's default regions don't allow.
CONFIG_ARM_MPU=n
CONFIG_LLEXT=y
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_LLEXT_HEAP_SIZE=16
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y

# The RAM extensions arrive in, via k_malloc(): see
# ExtensionLoaderCluster::kMaxExtensionSize.
CONFIG_HEAP_MEM_POOL_SIZE=12288
# The bridged endpoints' Ember tables live on this heap.
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=16384
