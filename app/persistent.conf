# Opt-in: persistent NVS/Settings storage across QEMU restarts, via a
# virtio-blk disk (backed by a real host disk image file, see
# scripts/run-qemu-macos.sh --persistent), formatted FAT and auto-mounted via
# devicetree fstab (persistent.overlay), with CHIP's Settings using
# CONFIG_SETTINGS_FILE instead of the default (ephemeral, RAM-backed
# flash-simulator) NVS backend.
#
# Build with:
#   west build ... -- -DEXTRA_CONF_FILE=persistent.conf \
#                      -DEXTRA_DTC_OVERLAY_FILE=persistent.overlay

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_VIRTIO_BLK=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y

# Switch Settings from NVS-on-simulated-flash (prj.conf default) to a file on
# the now-mounted, disk-backed FAT volume.
CONFIG_SETTINGS_NVS=n
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/SD:/settings/run"
