# Opt-in: Zephyr LLEXT (Linkable Loadable Extensions) support -- lets the
# device load and run a small binary extension at runtime. See Milestone 3
# in plan/plan-detailed.md.
#
# Build with:
#   west build ... -- -DEXTRA_CONF_FILE="persistent.conf;llext.conf" \
#                      -DEXTRA_DTC_OVERLAY_FILE=persistent.overlay
#
# CONFIG_LLEXT_IMPORT_ALL_GLOBALS avoids needing a precise EXPORT_SYMBOL
# table while x86 LLEXT itself is unproven on this board (zero existing
# samples target qemu_x86/x86 upstream) -- can be tightened later.
#
# NOTE: CONFIG_LLEXT_SHELL was tried for the Phase 0 smoke test (`llext
# load_hex`) but subsys/llext/shell.c calls plain libc aligned_alloc()/free(),
# which aren't covered by our --wrap=malloc interception and need picolibc's
# real sbrk()-based heap -- which needs __heap_start/__heap_end, which aren't
# defined because CONFIG_COMMON_LIBC_MALLOC=n (see prj.conf; disabled for an
# unrelated M1 crash). Rather than re-litigate that, Phase 0's smoke test
# calls llext_load() directly from C instead of via the shell.
CONFIG_LLEXT=y
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_LLEXT_HEAP_SIZE=128
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
