# Opt-in: LVGL bulb UI (src/gui/BulbUi.cpp) reflecting Matter's on/off +
# level state, rendered via QEMU's ramfb framebuffer device. No devicetree
# overlay needed -- qemu_x86's board .dts already has the ramfb0 node
# (chosen as zephyr,display) enabled unconditionally.
#
# Build with:
#   west build ... -- -DEXTRA_CONF_FILE="persistent.conf;lvgl.conf" \
#                      -DEXTRA_DTC_OVERLAY_FILE=persistent.overlay
#
# scripts/run-qemu-macos.sh auto-detects CONFIG_DISPLAY in the build's
# .config and opens a QEMU window instead of running headless.

CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_FONT_MONTSERRAT_14=y
